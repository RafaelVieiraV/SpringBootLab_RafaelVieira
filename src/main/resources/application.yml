spring:
    datasource:
        url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
        driver-class-name: org.h2.Driver
        username: sa
        password: '1234' # Es buena práctica ponerlo entre comillas si son solo números

    jpa: # Al mismo nivel que datasource
        hibernate:
            ddl-auto: update
        properties:
            hibernate:
                dialect: org.hibernate.dialect.H2Dialect

    sql: # Al mismo nivel que datasource
        init:
            mode: never

logging: # Al mismo nivel que 'spring'
    level:
        root: warn