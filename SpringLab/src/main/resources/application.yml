spring:
    datasource:
        url: jdbc:mysql://localhost:3304/spring_lab?useSSL=false
            &serverTimeZone=UTC
        username: root
        password: 123
        driver-class-name: com.mysql.cj.jdbc.Driver

    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true
        properties:
            hibernate:
                format_sql: true

    jackson:
        serialization:
            WRITE_DATES_AS_TIMESTAMPS: false


    devtools:
        restart:
            enable: true
server:
    port: 8084
